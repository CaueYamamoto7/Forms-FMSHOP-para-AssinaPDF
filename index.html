<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário FMSHOP</title>
  <link rel="icon" type="image/png" href="image.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0d1b2a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .form-container {
      background: #1b2838;
      border-radius: 10px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
      padding: 36px 40px;
      width: 100%;
      max-width: 600px;
    }

    .logo {
      display: block;
      margin: 0 auto 28px;
      max-width: 240px;
      height: auto;
    }

    .section {
      margin-bottom: 24px;
    }

    .section:last-of-type {
      margin-bottom: 0;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #c9a84c;
      padding-bottom: 10px;
      margin-bottom: 18px;
      border-bottom: 1px solid #2a3a4e;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-row .form-group {
      margin-bottom: 0;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #a0b0c2;
      font-size: 13px;
      font-weight: 500;
    }

    input {
      width: 100%;
      height: 46px;
      padding: 0 16px;
      border: 1px solid #2a3a4e;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: #e8ecf1;
      background: #152232;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input::placeholder {
      color: #5a6d82;
    }

    input:hover {
      border-color: #3a4e64;
    }

    input:focus {
      outline: none;
      border-color: #c9a84c;
      box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.12);
    }

    input[type="date"] {
      color-scheme: dark;
    }

    .lgpd-section {
      margin-top: 18px;
      padding: 14px 16px;
      background: #152232;
      border-radius: 8px;
      border: 1px solid #2a3a4e;
    }

    .lgpd-section label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      cursor: pointer;
      font-size: 12px;
      color: #8a9ab0;
      line-height: 1.5;
    }

    .lgpd-section input[type="checkbox"] {
      width: 18px;
      height: 18px;
      min-width: 18px;
      margin-top: 1px;
      accent-color: #c9a84c;
      cursor: pointer;
    }

    .lgpd-section a {
      color: #c9a84c;
      text-decoration: none;
    }

    .lgpd-section a:hover {
      text-decoration: underline;
    }

    .branding {
      text-align: center;
      margin-top: 16px;
      font-size: 15px;
      color: #4a5a6e;
    }

    .branding a {
      color: #c9a84c;
      text-decoration: none;
    }

    .branding a:hover {
      text-decoration: underline;
    }

    .divider {
      height: 1px;
      background: #2a3a4e;
      margin: 24px 0;
    }

    button[type="submit"] {
      width: 100%;
      height: 50px;
      background: #1d6fd1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 28px;
    }

    button[type="submit"]:hover {
      background: #1558b0;
    }

    button[type="submit"]:active {
      background: #124d99;
    }

    button[type="submit"]:disabled {
      background: #2a3f58;
      cursor: not-allowed;
      opacity: 0.7;
    }

    @media (max-width: 500px) {
      .form-container {
        padding: 28px 20px;
      }

      .form-row {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .form-group {
        margin-bottom: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="form-container">
    <img src="fmshop-removebg-preview.png" alt="Logo" class="logo">
    <form id="cadastroForm">

      <div class="section">
        <div class="section-title">Dados Pessoais</div>
        <div class="form-group">
          <label for="nome">Nome Completo (Ignore Acentuações)</label>
          <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" maxlength="11" placeholder="Somente números" required>
          </div>
          <div class="form-group">
            <label for="nascimento">Data de Nascimento</label>
            <input type="date" id="nascimento" name="nascimento" required>
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="section">
        <div class="section-title">Contato</div>
        <div class="form-row">
          <div class="form-group">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="ex: assinapdf@email.com" required>
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="section">
        <div class="section-title">Endereço</div>
        <div class="form-group">
          <label for="endereco">Endereço Completo</label>
          <input type="text" id="endereco" name="endereco" placeholder="Rua, número, bairro - Ponto de referência" required>
        </div>
        <div class="form-group">
          <label for="cidade">Cidade</label>
          <input type="text" id="cidade" name="cidade" placeholder="Digite sua cidade" required>
        </div>
      </div>
      <div class="divider"></div>

      <div class="lgpd-section">
        <label>
          <input type="checkbox" id="lgpdConsent" required>
          <span>Li e concordo com a <a href="#">Política de Privacidade</a> e autorizo o tratamento dos meus dados pessoais conforme a LGPD (Lei Geral de Proteção de Dados).</span>
        </label>
      </div>

      <button type="submit">Enviar</button>

      <p class="branding">Feito e controlado por <a href="https://assinapdf.com.br" target="_blank" rel="noopener noreferrer">AssinaPDF</a></p>
    </form>
  </div>

  <script>
    document.getElementById('cpf').addEventListener('input', function () {
      this.value = this.value.replace(/\D/g, '');
    });

    document.getElementById('telefone').addEventListener('input', function () {
      let v = this.value.replace(/\D/g, '');
      if (v.length > 11) v = v.slice(0, 11);
      if (v.length > 6) {
        this.value = '(' + v.slice(0,2) + ') ' + v.slice(2,7) + '-' + v.slice(7);
      } else if (v.length > 2) {
        this.value = '(' + v.slice(0,2) + ') ' + v.slice(2);
      } else if (v.length > 0) {
        this.value = '(' + v;
      }
    });

    const API_URL = 'proxy.php';

    document.getElementById('cadastroForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const btn = this.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'Enviando...';

      const dados = {
        nomecliente: document.getElementById('nome').value.trim(),
        cpfcliente: document.getElementById('cpf').value.trim(),
        enderecocliente: document.getElementById('endereco').value.trim(),
        cidade: document.getElementById('cidade').value.trim(),
        telefone: document.getElementById('telefone').value.replace(/\D/g, ''),
        email: document.getElementById('email').value.trim(),
        dn: document.getElementById('nascimento').value,
      };

      try {
        const resp = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json; charset=utf-8'
          },
          body: JSON.stringify(dados)
        });

        const json = await resp.json();

        if (resp.ok && json.status === 'success') {
          alert('Formulário enviado com sucesso!');
          this.reset();
        } else {
          alert('Erro: ' + (json.message || 'Erro ao enviar o formulário.'));
        }
      } catch (err) {
        alert('Erro de conexão com a API. Contacte o suporte.');
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Enviar';
      }
    });
  </script>
</body>
</html>
