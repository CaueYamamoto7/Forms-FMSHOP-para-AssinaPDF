<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário FMSHOP</title>
  <link rel="icon" type="image/png" href="image.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-container">
    <img src="fmshop-removebg-preview.png" alt="Logo" class="logo">
    <form id="cadastroForm">

      <div class="section">
        <div class="section-title">Dados Pessoais</div>
        <div class="form-group">
          <label for="nome">Nome Completo (Ignore Acentuações)</label>
          <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" maxlength="11" placeholder="Somente números" required>
          </div>
          <div class="form-group">
            <label for="nascimento">Data de Nascimento</label>
            <input type="date" id="nascimento" name="nascimento" required>
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="section">
        <div class="section-title">Contato</div>
        <div class="form-row">
          <div class="form-group">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="ex: assinapdf@email.com" required>
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="section">
        <div class="section-title">Endereço</div>
        <div class="form-group">
          <label for="endereco">Endereço Completo</label>
          <input type="text" id="endereco" name="endereco" placeholder="Rua, número, bairro - Ponto de referência" required>
        </div>
        <div class="form-group">
          <label for="cidade">Cidade</label>
          <input type="text" id="cidade" name="cidade" placeholder="Digite sua cidade" required>
        </div>
      </div>
      <div class="divider"></div>

      <div class="lgpd-section">
        <label for="lgpdConsent">
          <input type="checkbox" id="lgpdConsent" required>
          <span>Li e concordo com a <a href="politica-de-privacidade.html" target="_blank" rel="noopener noreferrer">Política de Privacidade</a> e autorizo o tratamento dos meus dados conforme a LGPD.</span>
        </label>
      </div>

      <button type="submit" id="submitBtn">
        <span class="btn-spinner" aria-hidden="true" hidden></span>
        <span class="btn-label">Criar Solicitação</span>
      </button>
      <p class="secure-note">Ambiente seguro • Seus dados protegidos</p>

      <p class="branding">Operado com segurança por <a href="https://assinapdf.com.br" target="_blank" rel="noopener noreferrer">AssinaPDF</a></p>
    </form>
  </div>

  <script>
    document.getElementById('cpf').addEventListener('input', function () {
      this.value = this.value.replace(/\D/g, '');
    });

    document.getElementById('telefone').addEventListener('input', function () {
      let v = this.value.replace(/\D/g, '');
      if (v.length > 11) v = v.slice(0, 11);
      if (v.length > 6) {
        this.value = '(' + v.slice(0,2) + ') ' + v.slice(2,7) + '-' + v.slice(7);
      } else if (v.length > 2) {
        this.value = '(' + v.slice(0,2) + ') ' + v.slice(2);
      } else if (v.length > 0) {
        this.value = '(' + v;
      }
    });

    const API_URL = 'proxy.php';

    document.getElementById('cadastroForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const btn = this.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'Enviando...';

      const dados = {
        nomecliente: document.getElementById('nome').value.trim(),
        cpfcliente: document.getElementById('cpf').value.trim(),
        enderecocliente: document.getElementById('endereco').value.trim(),
        cidade: document.getElementById('cidade').value.trim(),
        telefone: document.getElementById('telefone').value.replace(/\D/g, ''),
        email: document.getElementById('email').value.trim(),
        dn: document.getElementById('nascimento').value,
      };

      try {
        const resp = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json; charset=utf-8'
          },
          body: JSON.stringify(dados)
        });

        const json = await resp.json();

        if (resp.ok && json.status === 'success') {
          alert('Formulário enviado com sucesso!');
          this.reset();
        } else {
          alert('Erro: ' + (json.message || 'Erro ao enviar o formulário.'));
        }
      } catch (err) {
        alert('Erro de conexão com a API. Contacte o suporte.');
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Enviar';
      }
    });
  </script>
</body>
</html>
