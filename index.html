<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro FMSHOP</title>
  <meta name="description" content="Cadastro FMSHOP — preencha seus dados com segurança. Ambiente protegido conforme a LGPD.">
  <link rel="icon" type="image/png" href="images/image.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="form-container">
    <header class="form-header">
      <img src="images/fmshop-removebg-preview.png" alt="FMSHOP" class="logo">
      <p class="eyebrow">FMSHOP • Criar solicitação</p>
      <h1>Inicie seu contrato com a FMSHOP</h1>
    </header>

    <form id="cadastroForm" novalidate>
      <div id="formMessage" class="form-message" role="status" aria-live="polite" hidden></div>

      <section class="section" aria-labelledby="sec-pessoais">
        <h2 class="section-title" id="sec-pessoais"><span class="step" aria-hidden="true">1</span>Dados pessoais</h2>
        <div class="form-group">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" placeholder="Como está no seu documento" autocomplete="name" required>
          <p class="field-error" id="nome-error" hidden></p>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" maxlength="14" placeholder="000.000.000-00" inputmode="numeric" autocomplete="off" aria-describedby="cpf-error" required>
            <p class="field-error" id="cpf-error" hidden></p>
          </div>
          <div class="form-group">
            <label for="nascimento">Data de nascimento</label>
            <input type="date" id="nascimento" name="nascimento" autocomplete="bday" required>
            <p class="field-error" id="nascimento-error" hidden></p>
          </div>
        </div>
      </section>

      <section class="section" aria-labelledby="sec-contato">
        <h2 class="section-title" id="sec-contato"><span class="step" aria-hidden="true">2</span>Contato</h2>
        <div class="form-row">
          <div class="form-group">
            <label for="telefone">WhatsApp / Telefone</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" inputmode="tel" autocomplete="tel" aria-describedby="telefone-error" required>
            <p class="field-error" id="telefone-error" hidden></p>
          </div>
          <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="voce@exemplo.com" autocomplete="email" aria-describedby="email-error" required>
            <p class="field-error" id="email-error" hidden></p>
          </div>
        </div>
      </section>

      <section class="section" aria-labelledby="sec-endereco">
        <h2 class="section-title" id="sec-endereco"><span class="step" aria-hidden="true">3</span>Endereço</h2>
        <div class="form-group">
          <label for="endereco">Endereço completo</label>
          <input type="text" id="endereco" name="endereco" placeholder="Rua, número, bairro e ponto de referência" autocomplete="street-address" required>
          <p class="field-error" id="endereco-error" hidden></p>
        </div>
        <div class="form-group">
          <label for="cidade">Cidade</label>
          <input type="text" id="cidade" name="cidade" placeholder="Sua cidade" autocomplete="address-level2" required>
          <p class="field-error" id="cidade-error" hidden></p>
        </div>
      </section>

      <div class="lgpd-section">
        <label for="lgpdConsent">
          <input type="checkbox" id="lgpdConsent" required>
          <span>Li e concordo com a <a href="politica-de-privacidade.html" target="_blank" rel="noopener noreferrer">Política de Privacidade</a> e autorizo o tratamento dos meus dados conforme a LGPD.</span>
        </label>
      </div>

      <button type="submit" id="submitBtn">
        <span class="btn-spinner" aria-hidden="true" hidden></span>
        <span class="btn-label">Criar Solicitação</span>
      </button>
      <p class="secure-note">Ambiente seguro • Seus dados protegidos</p>

      <p class="branding">Operado com segurança por <a href="https://assinapdf.com.br" target="_blank" rel="noopener noreferrer">AssinaPDF</a></p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
